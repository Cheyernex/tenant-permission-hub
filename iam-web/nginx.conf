server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    proxy_pass http://resource-server:8080;
    proxy_set_header Host $host;
  }
  location /oauth2/ {
    proxy_pass http://auth-server:9000;
    proxy_set_header Host $host;
  }
}
